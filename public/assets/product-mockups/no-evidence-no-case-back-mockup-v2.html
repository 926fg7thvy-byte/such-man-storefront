<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;700&display=swap');
  
  body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  
  .product-mockup {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
    min-height: 2800px;
    background: #ffffff;
  }
  
  .shirt-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background: #0D0D0D;
    border-radius: 4px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    max-width: 360px;
    margin: 0 auto;
  }
  
  .shirt-base {
    width: 220px;
    height: 340px;
    background: #1A1A1A;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
  }
  
  .shirt-body {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 12px;
  }
  
  .shirt-svg {
    width: 100%;
    height: auto;
    max-width: 240px;
  }
  
  .shirt-tag {
    position: absolute;
    bottom: -30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  
  .shirt-tag-label {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #C9BCA7;
  }
  
  .shirt-tag-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #1A1A1A;
    line-height: 1.2;
  }
  
  .shirt-tag-design {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: #687A5A;
    letter-spacing: 1px;
  }
  
  .shirt-bucket {
    position: absolute;
    bottom: -16px;
    width: 100%;
    height: 20px;
    background: linear-gradient(to bottom, #687A5A, #4A5A3A);
    border-radius: 0 0 4px 4px;
  }
  
  .shirt-label {
    position: absolute;
    top: -24px;
    background: #1A1A1A;
    color: #C9BCA7;
    padding: 4px 12px;
    border-radius: 2px;
    font-family: 'Inter', sans-serif;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  
  .design-caption {
    margin-top: 16px;
    text-align: center;
    color: #F2EBDD;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="product-mockup">
    <div class="shirt-container">
      <div class="shirt-base">
        <div class="shirt-body">
          <object class="shirt-svg" data="assets/product/no-evidence-no-case/back.svg" type="image/svg+xml"></object>
          <div class="shirt-tag">
            <div class="shirt-tag-label">Back View</div>
            <div class="shirt-tag-title">NO EVIDENCE, NO CASE</div>
            <div class="shirt-tag-design">Design No. 001</div>
          </div>
        </div>
        <div class="shirt-bucket"></div>
      </div>
    </div>
    <div class="design-caption">
      <strong>Back View</strong><br>
      Original artwork printed on washed black heavyweight cotton
    </div>
  </div>
</body>
</html>
