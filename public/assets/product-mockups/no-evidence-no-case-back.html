<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #0D0D0D;
  }
  .t-shirt-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }
  .t-shirt {
    width: 300px;
    height: 340px;
    border: 1px solid #333;
    padding: 16px;
    background: #1A1A1A;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    border-radius: 4px;
  }
  .t-shirt-body {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  .t-shirt-svg {
    width: 100%;
    height: auto;
    max-width: 240px;
  }
</style>
</head>
<body>
  <div class="t-shirt-container">
    <div class="t-shirt">
      <div class="t-shirt-body">
        <object class="t-shirt-svg" data="assets/product/no-evidence-no-case/back.svg" type="image/svg+xml"></object>
        <div class="t-shirt-label">BACK · NO EVIDENCE, NO CASE</div>
      </div>
    </div>
  </div>
</body>
</html>
