<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;700&family=DM+Mono:wght@400;700&display=swap');
  
  body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  
  .mockup-frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px;
    background: #ffffff;
    min-height: 2800px;
  }
  
  .shirt-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    border-radius: 3px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.8);
    padding: 30px;
  }
  
  .shirt-base {
    width: 210px;
    height: 300px;
    background: #1A1A1A;
    border-radius: 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    position: relative;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
  }
  
  .shirt-body {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 10px;
  }
  
  .shirt-svg {
    width: 100%;
    height: auto;
    max-width: 220px;
    display: block;
  }
  
  .tag-area {
    position: absolute;
    bottom: -20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  
  .tag-label-small {
    font-family: 'Inter', sans-serif;
    font-size: 7px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #C9BCA7;
  }
  
  .tag-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #1A1A1A;
    line-height: 1.2;
  }
  
  .tag-design {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 8px;
    font-weight: 500;
    color: #687A5A;
    letter-spacing: 0.5px;
  }
  
  .bucket {
    position: absolute;
    bottom: -12px;
    width: 100%;
    height: 14px;
    background: linear-gradient(to bottom, #7A8A5A, #5A6A3A);
    border-radius: 0 0 3px 3px;
  }
  
  .caption {
    margin-top: 12px;
    text-align: center;
    color: #3A3A3A;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  
  .caption strong {
    color: #1A1A1A;
    font-weight: 600;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="mockup-frame">
    <div class="shirt-display">
      <div class="shirt-base">
        <div class="shirt-body">
          <object class="shirt-svg" data="assets/product/such-man-deh-deh/back.svg" type="image/svg+xml"></object>
          <div class="tag-area">
            <span class="tag-label-small">BACK VIEW</span>
            <span class="tag-title">SUCH MAN DEH DEH</span>
            <span class="tag-design">Design No. 001</span>
          </div>
        </div>
        <div class="bucket"></div>
      </div>
    </div>
    <div class="caption">
      <strong>BACK VIEW</strong><br>
      Original artwork printed on washed-black heavyweight cotton
    </div>
  </div>
</body>
</html>
